# Publie le site sur GitHub Pages avec des données de marché fraîches.
# - à chaque modification poussée sur main ;
# - toutes les 20 min en semaine pendant les heures de Bourse (Europe + États-Unis), et une fois par jour le week-end.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 6-21 * * 1-5"
    - cron: "0 8 * * 0,6"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Historiques longs et fondamentaux : réutilisés d'une exécution à l'autre (rafraîchis une fois par jour).
      - uses: actions/cache@v4
        with:
          path: data
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-
      - name: Récupérer les cours
        run: python tools/build_market_data.py
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r index.html css js data .nojekyll _site/
          # Version unique par publication : les navigateurs rechargent CSS/JS au lieu de garder l'ancienne version.
          sed -i -E 's#((href|src)="(css|js)/[^"]+\.(css|js))"#\1?v=${{ github.sha }}"#g' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
